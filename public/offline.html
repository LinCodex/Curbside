<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0d10" />
    <title>TicketSafe · Offline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b0d10;
        --text: #f5f6f8;
        --muted: #a6adb8;
        --line: #ffffff24;
      }
      html[data-theme="light"] {
        color-scheme: light;
        --bg: #f3f4f6;
        --text: #20242c;
        --muted: #596372;
        --line: #20242c24;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.7 system-ui,
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
      }
      main {
        max-width: 360px;
        padding: 30px;
      }
      img {
        border-radius: 18px;
      }
      h1 {
        font-size: 32px;
        letter-spacing: -1px;
        line-height: 1.3;
      }
      html[lang="zh-Hans"] h1 {
        letter-spacing: 0;
      }
      p {
        color: var(--muted);
      }
      a {
        color: var(--text);
        display: inline-block;
        padding: 12px 24px;
        min-height: 24px;
        border: 1px solid var(--line);
        border-radius: 14px;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid #3175e6;
        outline-offset: 4px;
      }
    </style>
    <script>
      let preferences = {};
      try {
        preferences = JSON.parse(
          localStorage.getItem("curbside.preferences.v1") || "{}",
        );
      } catch {}
      const language =
        preferences?.language === "zh" ||
        (preferences?.language !== "en" &&
          /^zh(?:-|$)/i.test(navigator.languages?.[0] || navigator.language));
      const light =
        preferences?.theme === "light" ||
        (preferences?.theme !== "dark" &&
          matchMedia("(prefers-color-scheme: light)").matches);
      document.documentElement.lang = language ? "zh-Hans" : "en";
      document.documentElement.dataset.theme = light ? "light" : "dark";
      document.querySelector('meta[name="theme-color"]').content = light
        ? "#f3f4f6"
        : "#0b0d10";
      document.title = language
        ? "罚单卫士 · 暂时离线"
        : "TicketSafe · Offline";
      document.addEventListener("DOMContentLoaded", () => {
        if (!language) return;
        document.querySelector("h1").textContent = "联网后，继续查看你的车辆。";
        document.querySelector("p").textContent =
          "你正在查看罚单卫士已缓存的离线页面。查询最新罚单及账户信息需要连接互联网。";
        document.querySelector("img").alt = "罚单卫士";
        document.querySelector("a").textContent = "重新连接";
      });
    </script>
  </head>
  <body>
    <main>
      <img
        src="/apple-touch-icon.png"
        width="64"
        height="64"
        alt="TicketSafe"
      />
      <h1>Connect to your city.</h1>
      <p>
        You’re viewing TicketSafe’s saved offline page. Live ticket records and
        account information need an internet connection.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
